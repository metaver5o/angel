name: Deploy mint page

# Auto-publishes the Angel mint page to GitHub Pages on every push to main.
on:
  push:
    branches: [main]
    paths: [web/index.html, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (frontend only)
        run: |
          mkdir -p _site
          cp -r web/. _site/
          # Stamp the deployed commit into the page's build footer.
          sed -i "s/__COMMIT__/${GITHUB_SHA::7}/" _site/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
