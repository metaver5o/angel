# Angel — Guardian Set mint, staging stack.
#
#   proxy     Caddy: serves web/ as the site, proxies /cp/* to your Counterparty
#             Core node (CP_UPSTREAM in .env) and /__version + /__deploy to the
#             deployer. One origin behind one tunnel.
#   deployer  pulls origin/main and hard-resets the working tree. Polls every
#             60s (so no cron) and backs the in-page Deploy button. web/ is a
#             live volume mount, so a pull republishes instantly. Every new
#             commit is also built (proxy + deployer, never the tunnel) by a
#             throwaway docker:cli container: logs/build.log. Also keeps
#             the activity/error log the page reports to: logs/events.jsonl
#             (gitignored) — `tail -f logs/events.jsonl` or
#             `docker compose logs -f deployer`.
#   tunnel    cloudflared quick tunnel -> proxy. Public https URL in its logs.
#
# The mint itself is client-side: the page composes through /cp, the wallet
# signs the commit, the page signs the reveal. No mint backend.
#
# Usage:
#   cp .env.example .env     # CP_UPSTREAM + DEPLOY_TOKEN
#   docker compose up -d
#   docker compose logs -f tunnel   # grab the https://*.trycloudflare.com URL

services:
  proxy:
    image: caddy:2-alpine
    environment:
      CP_UPSTREAM: ${CP_UPSTREAM:-host.docker.internal:4000}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Directory mount (not a single file): the deployer rewrites web/ via git,
      # and single-file bind mounts break on the inode swap.
      - ./web:/srv:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - deployer
    restart: unless-stopped

  deployer:
    build: ./deployer
    environment:
      REPO_DIR: /repo
      BRANCH: main
      REMOTE_URL: https://github.com/metaver5o/angel.git
      GITHUB_REPO: metaver5o/angel
      POLL_SECONDS: "60"
      DEPLOY_TOKEN: ${DEPLOY_TOKEN:-}
      EVENT_LOG: /repo/logs/events.jsonl
      # Build-on-push: where this repo lives on the host, and the compose
      # project to rebuild. The builder container passes HOST_REPO back in, so
      # this resolves the same whether compose runs on the host or in it.
      HOST_REPO: ${HOST_REPO:-${PWD}}
      COMPOSE_PROJECT: angel
    volumes:
      # The repo itself (rw): a pull here updates web/, which the proxy serves
      # live. .env is untracked, so reset --hard never touches it.
      - ./:/repo
      # Docker socket, to rebuild proxy/deployer on every push. Root-equivalent
      # on the host: fine for this test stack, not for prod. /__deploy (which
      # can trigger a build) needs DEPLOY_TOKEN, so keep that secret.
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    # Quick tunnel: no account needed. For a permanently stable URL, use a named
    # tunnel: set TUNNEL_TOKEN in .env and swap to:
    #   command: ["tunnel", "--no-autoupdate", "run", "--token", "${TUNNEL_TOKEN}"]
    command: ["tunnel", "--no-autoupdate", "--url", "http://proxy:80"]
    depends_on:
      - proxy
    restart: unless-stopped
